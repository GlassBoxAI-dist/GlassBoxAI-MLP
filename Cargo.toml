[package]
name = "glassboxai-mlp"
version = "0.1.0"
edition = "2021"
authors = ["Matthew Abbott"]
license = "MIT"
description = "Transparent, verifiable multi-layer perceptron with GPU support, introspection, and explainable AI features"
repository = "https://github.com/GlassBoxAI-dist/GlassBoxAI-MLP"
homepage = "https://github.com/GlassBoxAI-dist/GlassBoxAI-MLP"
documentation = "https://docs.rs/glassboxai-mlp"
readme = "README.md"
keywords = ["machine-learning", "neural-network", "gpu", "explainable-ai", "mlp"]
categories = ["algorithms", "science", "mathematics"]
exclude = [
    "examples/*.json",
    "*.json",
    "python/",
    "julia/",
    "cpp/",
    "kani/",
    ".github/",
]

# Library configuration
[lib]
name = "glassboxai_mlp"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Binary configuration
[[bin]]
name = "glassboxai-mlp"
path = "src/main.rs"
required-features = ["cli"]

# Examples
[[example]]
name = "xor"
path = "examples/xor.rs"

[features]
default = ["cuda"]
cli = []
cuda = ["cudarc"]
opencl = ["ocl"]
python = ["pyo3"]
nodejs = ["napi", "napi-derive"]
julia = []

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cudarc = { version = "0.12", features = ["driver", "nvrtc", "cuda-version-from-build-system"], optional = true }
ocl = { version = "0.19", optional = true }
prost = "0.13"
prost-types = "0.13"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
napi = { version = "2", features = ["napi9"], optional = true }
napi-derive = { version = "2", optional = true }

[build-dependencies]
prost-build = "0.13"
napi-build = "2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true

[package.metadata.docs.rs]
features = ["cuda", "opencl"]
rustdoc-args = ["--cfg", "docsrs"]
